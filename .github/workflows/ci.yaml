name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: docker.io/library/postgres:18.1-bookworm@sha256:99c4aa9886879ca26fb9fb99185a087ace6299b14fc23f96c2f07033653e04ed
        env:
          POSTGRES_DB: portfolio
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://portfolio:portfolio_ci_password@127.0.0.1:5432/portfolio
      APP_ORIGIN: http://127.0.0.1:3000
      SESSION_SECRET: ci_session_secret_32_bytes_minimum_value
      CSRF_SECRET: ci_csrf_secret_32_bytes_minimum_value
      IP_HASH_SECRET: ci_ip_hash_secret_32_bytes_minimum_value
      TURNSTILE_SECRET_KEY: ci_turnstile_secret
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Export Chromium path
        run: echo "CHROME_PATH=$(pnpm --filter web exec node -e \"console.log(require('playwright').chromium.executablePath())\")" >> "$GITHUB_ENV"
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrate
        run: pnpm --filter web db:migrate
      - name: Unit and integration
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Start production server
        run: |
          pnpm --filter web start > /tmp/portfolio-web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health/ready && exit 0
            sleep 2
          done
          cat /tmp/portfolio-web.log
          exit 1
      - name: E2E
        run: pnpm test:e2e
      - name: Accessibility
        run: pnpm test:a11y
      - name: Visual regression
        run: pnpm test:visual
      - name: Lighthouse CI
        run: pnpm --filter web exec lhci autorun

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@0b1f0509b2ddb4dc7bd94367abfe7ad1d8a1b810 # v3.30.5
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@0b1f0509b2ddb4dc7bd94367abfe7ad1d8a1b810 # v3.30.5

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
